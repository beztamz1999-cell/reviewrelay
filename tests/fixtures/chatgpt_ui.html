<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ReviewRelay local ChatGPT UI fixture</title>
  <style>
    body { font: 16px sans-serif; max-width: 50rem; margin: 2rem auto; }
    [data-message-author-role] { white-space: pre-wrap; border: 1px solid #bbb; padding: .6rem; margin: .6rem 0; }
    #composer { min-height: 3rem; border: 1px solid #555; padding: .5rem; }
    #attachments > div { display: inline-block; padding: .3rem; margin: .2rem; background: #eee; }
  </style>
</head>
<body>
  <main>
    <h1>Conversation</h1>
    <section id="conversation">
      <article data-message-author-role="user" data-message-id="old-user-1">Earlier user request</article>
      <article data-message-author-role="assistant" data-message-id="old-assistant-1">Earlier response: PASS is only old content.</article>
    </section>
    <div id="attachments"></div>
    <div id="upload-errors"></div>
    <input id="files" type="file" multiple aria-label="Attach files">
    <div id="composer" role="textbox" aria-label="Message ChatGPT" contenteditable="true"></div>
    <button id="send" type="button" aria-label="Send message" data-testid="send-button" disabled>Send</button>
    <button id="stop" type="button" data-testid="stop-button" hidden>Stop generating</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || "normal";
    const conversation = document.querySelector("#conversation");
    const composer = document.querySelector("#composer");
    const files = document.querySelector("#files");
    const send = document.querySelector("#send");
    const stop = document.querySelector("#stop");
    let nextId = 1;
    window.sendClicks = 0;

    if (mode === "login") {
      const login = document.createElement("button");
      login.textContent = "Log in";
      document.body.append(login);
    }
    if (mode === "modern-live-opaque-upload") {
      for (const user of document.querySelectorAll("[data-message-author-role='user']")) {
        user.removeAttribute("data-message-author-role");
        user.classList.add("bg-user-message");
      }
      for (const assistant of document.querySelectorAll("[data-message-author-role='assistant']")) {
        const markdown = document.createElement("div");
        markdown.className = "MarkdownRoot-fixture";
        markdown.textContent = assistant.textContent;
        assistant.removeAttribute("data-message-author-role");
        assistant.classList.add("group", "min-w-0", "flex-col");
        assistant.replaceChildren(markdown);
      }
    }
    if (mode === "missing-composer") composer.remove();
    if (mode === "search-only") {
      composer.remove();
      const search = document.createElement("input");
      search.type = "search";
      search.setAttribute("aria-label", "Search conversations");
      document.body.append(search);
    }
    if (mode === "disabled-composer") composer.setAttribute("contenteditable", "false");
    if (mode === "ask-chatgpt" || mode === "live-opaque-upload" || mode === "modern-live-opaque-upload") composer.setAttribute("aria-label", "Ask ChatGPT");
    if (mode === "whitespace-empty") composer.innerText = "\n";
    if (mode === "loading-draft") {
      const loading = document.createElement("div");
      loading.setAttribute("role", "status");
      loading.textContent = "Loading older messages…";
      document.body.append(loading);
      setTimeout(() => {
        const draftFile = document.createElement("div");
        draftFile.dataset.testid = "attachment-chip";
        draftFile.textContent = "owner-draft.txt";
        document.querySelector("#attachments").append(draftFile);
        loading.remove();
      }, 200);
    }
    if (mode === "lazy-upload") {
      files.type = "text";
      files.removeAttribute("aria-label");
      files.style.display = "none";
      const addFiles = document.createElement("button");
      addFiles.type = "button";
      addFiles.setAttribute("aria-label", "Add files and more");
      addFiles.textContent = "+";
      addFiles.disabled = true;
      setTimeout(() => { addFiles.disabled = false; }, 80);
      addFiles.addEventListener("click", () => setTimeout(() => {
        files.type = "file";
        files.setAttribute("aria-label", "Attach files");
        files.style.display = "block";
      }, 60));
      document.body.append(addFiles);
    }
    if (mode === "draft") {
      composer.innerText = "Owner draft that must not be overwritten";
      send.disabled = false;
    }
    if (mode === "no-send-button") send.remove();

    composer?.addEventListener("input", () => {
      send.disabled = composer.innerText.length === 0;
    });
    files.addEventListener("change", event => {
      const files = Array.from(event.target.files || []);
      if (mode === "upload-error") {
        const error = document.createElement("div");
        error.dataset.testid = "upload-error";
        error.textContent = "Upload failed";
        document.querySelector("#upload-errors").append(error);
        return;
      }
      if (mode === "live-opaque-upload" || mode === "modern-live-opaque-upload") {
        const chip = document.createElement("span");
        chip.className = "group/composer-attachment";
        const label = document.createElement("span");
        label.textContent = "Attachment ready";
        const remove = document.createElement("button");
        remove.setAttribute("aria-label", "Remove selected attachment");
        chip.append(label, remove);
        document.querySelector("#attachments").append(chip);
        const progress = document.createElement("div");
        progress.setAttribute("role", "progressbar");
        progress.setAttribute("aria-label", "Uploading file");
        document.querySelector("#attachments").append(progress);
        setTimeout(() => progress.remove(), 140);
        return;
      }
      for (const file of files) {
        const chip = document.createElement("div");
        if (mode === "lazy-upload") {
          const filename = document.createElement("span");
          filename.textContent = file.name;
          const remove = document.createElement("button");
          remove.setAttribute("aria-label", `Remove ${file.name}`);
          chip.append(filename, remove);
          const progress = document.createElement("div");
          progress.setAttribute("role", "progressbar");
          progress.setAttribute("aria-label", `Uploading ${file.name}`);
          document.querySelector("#attachments").append(chip, progress);
          setTimeout(() => progress.remove(), 140);
        } else {
          chip.dataset.testid = "attachment-chip";
          chip.textContent = file.name;
          document.querySelector("#attachments").append(chip);
        }
      }
      if (mode === "attachment-extra") {
        const extra = document.createElement("div");
        extra.dataset.testid = "attachment-chip";
        extra.textContent = "manual-owner-file.txt";
        document.querySelector("#attachments").append(extra);
      }
      if (mode === "concurrent-upload") {
        const other = document.createElement("article");
        other.dataset.messageAuthorRole = "user";
        other.dataset.messageId = `manual-user-${nextId++}`;
        other.textContent = "Manual message during attachment upload";
        conversation.append(other);
      }
    });

    send.addEventListener("click", () => {
      window.sendClicks += 1;
      if (mode === "navigation") {
        location.assign("/outside");
        return;
      }
      if (mode === "ambiguous-send") return;
      const text = composer.innerText;
      const modernLive = mode === "modern-live-opaque-upload";
      const user = document.createElement(modernLive ? "div" : "article");
      if (modernLive) user.classList.add("bg-user-message");
      else {
        user.dataset.messageAuthorRole = "user";
        user.dataset.messageId = `relay-user-${nextId++}`;
      }
      user.textContent = text;
      conversation.append(user);
      composer.innerText = "";
      send.disabled = true;

      if (mode === "extra-user") {
        const other = document.createElement("article");
        other.dataset.messageAuthorRole = "user";
        other.dataset.messageId = `manual-user-${nextId++}`;
        other.textContent = "Manual concurrent message";
        conversation.append(other);
      }
      if (mode === "timeout") return;

      const responseText = mode === "integration"
        ? "Review summary.\n<RELAY_CONTROL>{\"protocol\":\"rr.v1\",\"candidate_sha\":\"abc123\",\"cycle\":1,\"action\":\"PASS\"}</RELAY_CONTROL>\nEnd summary."
        : "Markdown **kept**.\nProse before.\n<RELAY_CONTROL>{\"protocol\":\"rr.v1\",\"candidate_sha\":\"abc123\",\"cycle\":1,\"action\":\"PASS\"}</RELAY_CONTROL>\nProse after.";
      stop.hidden = false;
      const assistant = document.createElement(modernLive ? "div" : "article");
      let assistantContent = assistant;
      if (modernLive) {
        assistant.classList.add("group", "min-w-0", "flex-col");
        const markdown = document.createElement("div");
        markdown.className = "MarkdownRoot-fixture";
        assistant.append(markdown);
        assistantContent = markdown;
      } else {
        assistant.dataset.messageAuthorRole = "assistant";
        assistant.dataset.messageId = `relay-assistant-${nextId++}`;
      }
      conversation.append(assistant);

      let index = 0;
      const timer = setInterval(() => {
        index = Math.min(responseText.length, index + 7);
        assistantContent.textContent = responseText.slice(0, index);
        if (index === responseText.length) {
          clearInterval(timer);
          stop.hidden = true;
          send.disabled = false;
          if (mode === "multiple-assistant") {
            const extra = document.createElement("article");
            extra.dataset.messageAuthorRole = "assistant";
            extra.dataset.messageId = `unexpected-assistant-${nextId++}`;
            extra.textContent = "Unexpected second assistant turn";
            conversation.append(extra);
          }
        }
      }, 8);
    });
  </script>
</body>
</html>
