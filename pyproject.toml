[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewrelay"
version = "0.1.0"
description = "Portable review relay with deterministic protocol and ChatGPT web transport"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.49,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
